<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>対旋律作成ツール</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

<!-- ローディング -->
<div id="loading">読み込み中…</div>

<!-- ファイル入力（非表示） -->
<input type="file" id="csv-file-input"  accept=".csv">
<input type="file" id="midi-file-input" accept=".mid,.midi">

<!-- ─── トップバー ─── -->
<div id="topbar">
  <h1>対旋律作成ツール</h1>
  <button id="btn-import"       class="btn btn-blue"  >CSVインポート</button>
  <button id="btn-import-midi"  class="btn btn-indigo">MIDIインポート</button>
  <button id="btn-new"      class="btn btn-gray"  >新規作成</button>
  <button id="btn-generate" class="btn btn-green" >対旋律を自動生成</button>
  <button id="btn-midi"     class="btn btn-purple">MIDI出力</button>
  <button id="btn-csv"      class="btn btn-orange">CSV出力</button>
  <button id="play-btn"     class="btn btn-teal"  >▶ 再生</button>
</div>

<!-- ─── コード進行 ─── -->
<div class="panel" style="display:flex; align-items:center; gap:16px;">
  <div class="panel-title" style="white-space:nowrap">コード進行</div>
  <div id="chord-selectors" style="display:flex; gap:8px;"></div>
</div>

<!-- ─── ドラッグ挿入 ─── -->
<div class="panel" style="display:flex; align-items:center; gap:12px;">
  <span style="font-size:11px; color:#555; font-weight:bold;">ドラッグ挿入:</span>
  <button id="insert-note-btn" class="btn btn-insert-note">♪ 八分音符</button>
  <button id="insert-rest-btn" class="btn btn-insert-rest">♩ 八分休符</button>
  <span style="font-size:11px; color:#aaa;">← スコアの空きにドラッグして挿入</span>
</div>

<!-- ─── 重複ハイライト ─── -->
<div class="panel" id="ol-panel">
  <div class="panel-title" style="display:inline;">重複ハイライト</div>
  <div style="display:flex; align-items:center; gap:8px; margin-top:5px; flex-wrap:wrap;">
    <label>声部A:</label>
    <select id="ol-va"></select>
    <label>声部B:</label>
    <select id="ol-vb"></select>
    <button id="ol-apply-btn" class="btn btn-green" style="padding:4px 12px;">ハイライト</button>
    <button id="ol-clear-btn" class="btn btn-gray"  style="padding:4px 10px;">クリア</button>
  </div>
</div>

<!-- ─── 度数ハイライト ─── -->
<div class="panel" id="hl-panel">
  <div class="panel-title" style="display:inline;">度数ハイライト</div>
  <!-- HL1 ピンク -->
  <div style="display:flex; align-items:center; gap:8px; margin-top:6px; flex-wrap:wrap;">
    <button id="hl-toggle-btn" class="btn btn-hl-off" style="width:72px;">HL: OFF</button>
    <span style="background:#ffd6e0; border:1px solid #e0507a; color:#c0305a; padding:2px 8px; border-radius:3px; font-size:11px; font-weight:bold;">HL1●</span>
    <label>声部A:</label>
    <select id="hl-va"></select>
    <label>声部B:</label>
    <select id="hl-vb"></select>
    <label>度数:</label>
    <select id="hl-deg" style="width:50px;"></select>
    <button id="hl-apply-btn"    class="btn btn-pink"   style="padding:4px 12px;">ハイライト</button>
    <button id="hl-clear-btn"    class="btn btn-gray"   style="padding:4px 10px;">クリア</button>
    <button id="hl-select-a-btn" class="btn btn-orange" style="padding:4px 10px;">声部A 一括選択</button>
    <button id="hl-select-b-btn" class="btn btn-orange" style="padding:4px 10px;">声部B 一括選択</button>
  </div>
  <!-- HL2 ブルー -->
  <div style="display:flex; align-items:center; gap:8px; margin-top:5px; flex-wrap:wrap;">
    <div style="width:72px;"></div>
    <span style="background:#d6eaff; border:1px solid #3498db; color:#1a70b8; padding:2px 8px; border-radius:3px; font-size:11px; font-weight:bold;">HL2●</span>
    <label>声部A:</label>
    <select id="hl-va2"></select>
    <label>声部B:</label>
    <select id="hl-vb2"></select>
    <label>度数:</label>
    <select id="hl-deg2" style="width:50px;"></select>
    <button id="hl-apply-btn2"    class="btn btn-blue"   style="padding:4px 12px;">ハイライト</button>
    <button id="hl-clear-btn2"    class="btn btn-gray"   style="padding:4px 10px;">クリア</button>
    <button id="hl-select-a-btn2" class="btn btn-orange" style="padding:4px 10px;">声部A 一括選択</button>
    <button id="hl-select-b-btn2" class="btn btn-orange" style="padding:4px 10px;">声部B 一括選択</button>
  </div>
</div>

<!-- ─── ミュート ─── -->
<div class="panel" style="display:flex; align-items:center; gap:8px; flex-wrap:wrap;">
  <span style="font-size:11px; font-weight:bold; color:#555; white-space:nowrap;">ミュート:</span>
  <button id="mute-btn-melody"    class="btn btn-mute" onclick="toggleMute('melody')"   >🔊 主旋律</button>
  <button id="mute-btn-mid"       class="btn btn-mute" onclick="toggleMute('mid')"      >🔊 中音域</button>
  <button id="mute-btn-bass_high" class="btn btn-mute" onclick="toggleMute('bass_high')">🔊 低音域</button>
  <button id="mute-btn-bass_low"  class="btn btn-mute" onclick="toggleMute('bass_low')" >🔊 超低音域</button>
</div>

<!-- ─── スコアエリア ─── -->
<div id="score-area"></div>

<!-- ─── ステータスバー ─── -->
<div id="statusbar">起動中…</div>

<!-- Tone.js (CDN) -->
<script src="https://cdn.jsdelivr.net/npm/tone@14/build/Tone.js"></script>
<!-- アプリ JavaScript -->
<script src="/static/js/note_utils.js"></script>
<script src="/static/js/score.js"></script>
<script src="/static/js/app.js"></script>
</body>
</html>
